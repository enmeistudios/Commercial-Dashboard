<script>const SHEET_ID = '1Nq5xLYTw9Bx_aGXrZbAExp1h32fLwMBE6037LIHn-Gc';</script>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enmei — Commercial Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap');
:root{
  --bg:#0d0d0f;--bg2:#141416;--bg3:#1c1c20;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);
  --text:#f0ede8;--text2:#9b9690;--text3:#5a5752;
  --enmei:#e8442a;--enmei-dim:rgba(232,68,42,0.14);
  --pos:#4caf7d;--neg:#e05252;
  --pos-bg:rgba(76,175,125,0.13);--neg-bg:rgba(224,82,82,0.13);
  --radius:10px;--radius-lg:16px;
  --grid:rgba(255,255,255,0.05);
  --sans:'Inter',system-ui,sans-serif;
  --serif:'DM Serif Display',Georgia,serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.app-shell{max-width:1200px;margin:0 auto;padding:32px 24px 80px}
.app-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:8px}
.app-header h1{font-family:var(--serif);font-size:26px;font-weight:400}
.app-header h1 em{font-style:italic;color:var(--enmei)}
.pmeta{font-size:11px;color:var(--text3);text-align:right}
.app-subtitle{color:var(--text2);font-size:12.5px;margin-bottom:24px}

.filter-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius)}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-group label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3)}
.filter-group select{background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:6px;padding:6px 10px;font-size:13px;font-family:var(--sans);min-width:160px}

.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:20px}
.mc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;position:relative;overflow:hidden}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--enmei)}
.mc.pos::before{background:var(--pos)}.mc.neg::before{background:var(--neg)}
.ml{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.mv{font-size:20px;font-weight:500;letter-spacing:-.02em}
.ms{font-size:10.5px;color:var(--text3);margin-top:3px}

.cc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:16px}
.cch{margin-bottom:12px}
.cct{font-size:12.5px;font-weight:500}
.ccs{font-size:10.5px;color:var(--text3);margin-top:2px}
.h280{position:relative;height:280px}
.empty-state{color:var(--text3);font-size:13px;padding:40px 0;text-align:center}

#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .4s}
#loading.hidden{opacity:0;pointer-events:none}
.spinner{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--enmei);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:13px;color:var(--text3)}
.live{display:inline-block;width:6px;height:6px;background:var(--pos);border-radius:50%;margin-right:5px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.sync-status{font-size:11px;color:var(--text3)}
.sync-status.err{color:var(--neg)}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p id="load-msg">Connecting to Google Sheets…</p></div>

<div class="app-shell">
  <div class="app-header">
    <h1>Enmei <em>Commercial Dashboard</em></h1>
    <div class="pmeta"><span class="live"></span><span class="sync-status" id="sync-status">Connecting…</span></div>
  </div>
  <p class="app-subtitle">Membership performance across studios — refreshed weekly from Mariana Tek.</p>

  <div class="filter-bar" id="filter-bar" style="display:none">
    <div class="filter-group">
      <label for="f-studio">Studio</label>
      <select id="f-studio"><option value="all">All studios</option></select>
    </div>
    <div class="filter-group">
      <label for="f-type">Membership type</label>
      <select id="f-type"><option value="all">All types</option></select>
    </div>
    <div class="filter-group">
      <label for="f-weeks">Time frame</label>
      <select id="f-weeks">
        <option value="4">Last 4 weeks</option>
        <option value="12" selected>Last 12 weeks</option>
        <option value="26">Last 26 weeks</option>
      </select>
    </div>
  </div>

  <div id="content"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// GVIZ FETCH
// ════════════════════════════════════════════════════════════════
async function fetchSheet(tabName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(tabName)}`;
  let res;
  try {
    res = await fetch(url);
  } catch (netErr) {
    if (window.location.protocol === 'file:') {
      throw new Error('Local file:// cannot fetch Google Sheets. Host this file (Netlify, GitHub Pages, etc.) rather than opening it directly.');
    }
    throw new Error(`Network error fetching ${tabName}: ${netErr.message}`);
  }
  if (!res.ok) throw new Error(`HTTP ${res.status} for tab "${tabName}". Check the Sheet ID and sharing settings.`);
  const text = await res.text();
  if (text.includes('accounts.google.com') || text.includes('ServiceLogin')) {
    throw new Error('Sheet is not public. Go to File -> Share -> Publish to web, and Share -> "Anyone with the link can view".');
  }
  const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
  if (!match) throw new Error(`Unexpected response for tab "${tabName}". Confirm it's published to web and the tab name matches exactly.`);
  return JSON.parse(match[1]).table;
}

function parseGvizTable(table) {
  if (!table || !table.cols || !table.rows) return [];
  const labels = table.cols.map(c => c.label || c.id);
  return table.rows.map(row => {
    const obj = {};
    labels.forEach((label, i) => {
      const cell = row.c[i];
      obj[label] = cell ? cell.v : null;
    });
    return obj;
  });
}

// ════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════
const f  = v => v == null ? '—' : '£' + Math.round(v).toLocaleString('en-GB');
const fK = v => v == null ? '—' : '£' + (Math.round(v/100)/10).toFixed(1) + 'k';
const C = { enmei: '#e8442a', pos: '#4caf7d', neg: '#e05252', text2: '#9b9690', grid: 'rgba(255,255,255,0.05)' };
const xsc = () => ({ ticks: { color: C.text2, font: { size: 11 } }, grid: { display: false } });
const ysc = () => ({ ticks: { color: C.text2, font: { size: 11 } }, grid: { color: C.grid } });
const charts = {};
function mk(id, cfg) { if (charts[id]) charts[id].destroy(); charts[id] = new Chart(document.getElementById(id), cfg); }

// ════════════════════════════════════════════════════════════════
// STATE + FILTERING
// ════════════════════════════════════════════════════════════════
let ALL_ROWS = [];

function populateFilters() {
  const studios = Array.from(new Set(ALL_ROWS.map(r => r.studio).filter(Boolean))).sort();
  const types = Array.from(new Set(ALL_ROWS.map(r => r.membership_type).filter(Boolean))).sort();

  const studioSel = document.getElementById('f-studio');
  studios.forEach(s => studioSel.insertAdjacentHTML('beforeend', `<option value="${s}">${s}</option>`));

  const typeSel = document.getElementById('f-type');
  types.forEach(t => typeSel.insertAdjacentHTML('beforeend', `<option value="${t}">${t}</option>`));

  document.getElementById('filter-bar').style.display = 'flex';
  ['f-studio', 'f-type', 'f-weeks'].forEach(id => document.getElementById(id).addEventListener('change', render));
}

function getFilteredRows() {
  const studio = document.getElementById('f-studio').value;
  const type = document.getElementById('f-type').value;
  const weeksBack = Number(document.getElementById('f-weeks').value);

  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - weeksBack * 7);
  const cutoffStr = cutoff.toISOString().slice(0, 10);

  return ALL_ROWS.filter(r => {
    if (studio !== 'all' && r.studio !== studio) return false;
    if (type !== 'all' && r.membership_type !== type) return false;
    if (r.week && r.week < cutoffStr) return false;
    return true;
  });
}

function aggregateByWeek(rows) {
  const byWeek = new Map();
  for (const row of rows) {
    const key = row.week;
    if (!byWeek.has(key)) byWeek.set(key, { week: key, active_count: 0, cancelled_count: 0, revenue: 0 });
    const e = byWeek.get(key);
    e.active_count += row.active_count || 0;
    e.cancelled_count += row.cancelled_count || 0;
    e.revenue += row.revenue || 0;
  }
  return Array.from(byWeek.values()).sort((a, b) => a.week.localeCompare(b.week));
}

function aggregateByType(rows) {
  const byType = new Map();
  for (const row of rows) {
    const key = row.membership_type || 'Unknown';
    if (!byType.has(key)) byType.set(key, { membership_type: key, revenue: 0 });
    byType.get(key).revenue += row.revenue || 0;
  }
  return Array.from(byType.values()).sort((a, b) => b.revenue - a.revenue);
}

// ════════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════════
function render() {
  const rows = getFilteredRows();
  const weekly = aggregateByWeek(rows);
  const byType = aggregateByType(rows);

  const latestActive = weekly.length ? weekly[weekly.length - 1].active_count : 0;
  const totalRevenue = rows.reduce((s, r) => s + (r.revenue || 0), 0);
  const totalCancelled = rows.reduce((s, r) => s + (r.cancelled_count || 0), 0);

  let html = `
    <div class="mgrid">
      <div class="mc"><div class="ml">Active members (latest week)</div><div class="mv">${latestActive.toLocaleString()}</div></div>
      <div class="mc"><div class="ml">Revenue (period)</div><div class="mv">${fK(totalRevenue)}</div></div>
      <div class="mc"><div class="ml">Cancellations (period)</div><div class="mv">${totalCancelled.toLocaleString()}</div></div>
    </div>
  `;

  if (weekly.length === 0) {
    html += `<div class="cc"><div class="empty-state">No data for this filter combination yet. Check back after the weekly refresh has run, or widen the time frame.</div></div>`;
    document.getElementById('content').innerHTML = html;
    return;
  }

  html += `
    <div class="cc"><div class="cch"><div class="cct">Active members over time</div><div class="ccs">Weekly, for the selected filters</div></div><div class="h280"><canvas id="chartActive"></canvas></div></div>
    <div class="cc"><div class="cch"><div class="cct">Revenue by membership type</div></div><div class="h280"><canvas id="chartRevenue"></canvas></div></div>
    <div class="cc"><div class="cch"><div class="cct">Cancellations over time</div></div><div class="h280"><canvas id="chartCancelled"></canvas></div></div>
  `;
  document.getElementById('content').innerHTML = html;

  mk('chartActive', { type: 'line', data: { labels: weekly.map(w => w.week), datasets: [{
    data: weekly.map(w => w.active_count), borderColor: C.enmei, backgroundColor: 'rgba(232,68,42,0.1)',
    fill: true, tension: .4, pointRadius: 3,
  }]}, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: xsc(), y: ysc() } } });

  mk('chartRevenue', { type: 'bar', data: { labels: byType.map(t => t.membership_type), datasets: [{
    data: byType.map(t => t.revenue), backgroundColor: C.enmei, borderRadius: 4, borderSkipped: false,
  }]}, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: xsc(), y: ysc() } } });

  mk('chartCancelled', { type: 'line', data: { labels: weekly.map(w => w.week), datasets: [{
    data: weekly.map(w => w.cancelled_count), borderColor: C.neg, backgroundColor: 'rgba(224,82,82,0.1)',
    fill: true, tension: .4, pointRadius: 3,
  }]}, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: xsc(), y: ysc() } } });
}

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════
async function init() {
  const loading = document.getElementById('loading');
  const status = document.getElementById('sync-status');

  if (SHEET_ID === 'PASTE_YOUR_SHEET_ID_HERE') {
    loading.classList.add('hidden');
    status.textContent = 'No Sheet ID configured';
    status.classList.add('err');
    document.getElementById('content').innerHTML = `<div class="cc"><div class="empty-state">Add your Google Sheet ID at the top of this file to connect.</div></div>`;
    return;
  }

  try {
    const table = await fetchSheet('Membership_Data');
    ALL_ROWS = parseGvizTable(table);
    status.textContent = `Live · Google Sheets ✓ · ${ALL_ROWS.length} rows`;
    loading.classList.add('hidden');
    populateFilters();
    render();
  } catch (e) {
    console.error('Sheet load error:', e);
    loading.classList.add('hidden');
    status.textContent = 'Sheet error — see below';
    status.classList.add('err');
    document.getElementById('content').innerHTML = `<div class="cc"><div class="empty-state"><strong>Error:</strong> ${e.message}</div></div>`;
  }
}
init();
</script>
</body>
</html>
