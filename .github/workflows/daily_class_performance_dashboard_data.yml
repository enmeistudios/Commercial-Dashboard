name: Daily Class Performance Dashboard Data Refresh

# Builds Class Performance from Mariana Tek's RAW data (class sessions,
# reservations, spot holds) -- no longer from the retired table report 294.
# Writes the ClassPerformance_* tabs the dashboard reads.

on:
  schedule:
    - cron: '0 10 * * *'  # Daily, 10:00 UTC (staggered after Intro Offers' 9:00 UTC run)
  workflow_dispatch:
    inputs:
      debug_only:
        description: 'Debug only -- inspect data in logs, skip writing to Google Sheets'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      compare_days:
        description: 'Optional: days of history to compare against report 294 (0 = skip). Only works while report access lasts.'
        required: false
        default: '0'
        type: string
      history_start:
        description: 'Optional: shorten a TEST run by starting from this date (YYYY-MM-DD). Only works with debug_only=true. Leave blank for full history.'
        required: false
        default: ''
        type: string
jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build Class Performance from raw Mariana Tek data and write to Google Sheet
        env:
          MARIANA_API_KEY: ${{ secrets.MARIANA_API_KEY }}
          MARIANA_BASE_URL: ${{ secrets.MARIANA_BASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DEBUG_ONLY_SKIP_SHEET_WRITE: ${{ github.event.inputs.debug_only || 'false' }}
          CP_COMPARE_DAYS: ${{ github.event.inputs.compare_days || '0' }}
          CP_RAW_HISTORY_START: ${{ github.event.inputs.history_start || '' }}
        run: python scripts/build_class_performance_raw.py
