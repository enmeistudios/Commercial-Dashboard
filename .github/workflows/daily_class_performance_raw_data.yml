name: Daily Class Performance RAW-DATA Refresh (parallel to the report version)

on:
  schedule:
    - cron: '30 10 * * *'  # Daily, 10:30 UTC -- 30 min after the report-based Class Performance run
  workflow_dispatch:
    inputs:
      debug_only:
        description: 'Debug only -- inspect data in logs, skip writing to Google Sheets'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      compare_days:
        description: 'Days of history to compare against report 294 (default 56). Use 700 for a full-history check.'
        required: false
        default: '56'
        type: string
      history_start:
        description: 'Optional: shorten a TEST run by starting from this date (YYYY-MM-DD, e.g. 2026-08-01). Only works with debug_only=true. Leave blank for full history.'
        required: false
        default: ''
        type: string
jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build Class Performance from raw Mariana Tek data, compare with report 294, write to Google Sheet
        env:
          MARIANA_API_KEY: ${{ secrets.MARIANA_API_KEY }}
          MARIANA_BASE_URL: ${{ secrets.MARIANA_BASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DEBUG_ONLY_SKIP_SHEET_WRITE: ${{ github.event.inputs.debug_only || 'false' }}
          CP_COMPARE_DAYS: ${{ github.event.inputs.compare_days || '56' }}
          CP_RAW_HISTORY_START: ${{ github.event.inputs.history_start || '' }}
        run: python scripts/build_class_performance_raw.py
